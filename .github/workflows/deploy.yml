name: Deploy to GitHub Pages

on:
  push:
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'

      - name: Setup Pages
        uses: actions/configure-pages@v5

      # Build the main/root Jekyll site
      - name: Install root site dependencies
        run: bundle install

      - name: Build root site
        run: bundle exec jekyll build
        env:
          JEKYLL_ENV: production

      # Build the stories site
      - name: Install stories dependencies
        working-directory: stories
        run: bundle install

      - name: Build stories site
        working-directory: stories
        run: bundle exec jekyll build
        env:
          JEKYLL_ENV: production

      # Merge: copy stories into root _site/stories
      - name: Merge sites
        run: |
          mkdir -p _site/stories
          cp -r stories/_site/* _site/stories/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
