name: Deploy to GitHub Pages

on:
  push:
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: stories

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Build stories site
        run: |
          cd stories
          bundle exec jekyll build --baseurl "/stories"
        env:
          JEKYLL_ENV: production

      - name: Prepare deployment
        run: |
          # Create output directory
          mkdir -p _site

          # Copy stories site to _site/stories
          cp -r stories/_site _site/stories

          # Copy any other static files from root (if they exist)
          # Exclude stories/, .git/, .github/, and Jekyll-specific files
          find . -maxdepth 1 -type f \( -name "*.html" -o -name "*.css" -o -name "*.js" -o -name "*.jpg" -o -name "*.png" -o -name "*.ico" \) -exec cp {} _site/ \;

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
