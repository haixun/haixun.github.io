<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
  <style>
    body {
      max-width: 40rem;
      margin: 3rem auto;
      padding: 0 1.25rem;
      font: 17px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      color: #222;
      background: #fff;
    }
    h1, h2, h3 { line-height: 1.25; font-weight: 600; }
    h3 { margin-top: 2.25rem; font-size: 1.1rem; }
    a { color: #1a5fb4; text-decoration: none; }
    a:hover { text-decoration: underline; }
    img { max-width: 100%; height: auto; }
    ul { padding-left: 1.25rem; }
    li { margin: 0.2rem 0; }
    .intro { display: flex; align-items: center; gap: 1.5rem; margin-bottom: 2rem; }
    .intro img { width: 140px; border-radius: 4px; }
    .intro h1 { margin: 0 0 0.25rem; font-size: 2rem; }
    .intro p { margin: 0; color: #555; }
    @media (max-width: 480px) { .intro { flex-direction: column; align-items: flex-start; } }
  </style>
</head>
<body>
  {% if page.title %}<h1>{{ page.title }}</h1>{% endif %}
  {{ content }}
</body>
</html>
